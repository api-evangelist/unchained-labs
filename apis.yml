name: Unchained Labs
description: >-
  Unchained Labs is a life-science tools company that designs, manufactures, and
  sells analytical instruments, automation, and consumables for biologics, gene
  therapy, cell therapy, nanoparticle, exosome, and genomics research. Its product
  line includes plate-based systems for protein characterization, concentration and
  quantification (Lunatic and Stunner), protein stability and formulation (Uncle),
  automated buffer exchange and sample prep (Big Tuna, Little Big Tuna), viscosity
  measurement, and lipid-nanoparticle synthesis and analysis. The company serves
  biopharma R&D, process development, and QC labs. Unchained Labs is primarily a
  hardware, reagent, and lab-software vendor; as of this enrichment pass it exposes
  no public developer API, REST/GraphQL surface, SDK, or developer portal. This
  profile was surfaced as a portfolio company of Canaan Partners and enriched with
  verified company identity and link properties from its public website.
